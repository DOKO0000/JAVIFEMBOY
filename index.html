<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuantos Puntos de amor tienen</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #ffdae9; /* Rosa pastel */
      color: #4a1525; /* Color de texto en contraste */
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #8c1c40;
      font-size: 2rem;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
    }

    .counter-container {
      background-color: #ffffff;
      padding: 25px 45px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(140, 28, 64, 0.15);
      text-align: center;
      margin-bottom: 30px;
      border: 3px solid #f28ab2;
    }

    .counter-number {
      font-size: 54px;
      font-weight: bold;
      color: #d6336c;
      margin-bottom: 15px;
    }

    button {
      background-color: #d6336c;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(214, 51, 108, 0.3);
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    button:hover {
      background-color: #b82558;
    }

    button:active {
      transform: scale(0.96);
    }

    button:disabled {
      background-color: #e0a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Estructura para los perfiles y el corazón */
    .profiles-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background-color: #ffffff;
      padding: 20px 30px;
      border-radius: 25px;
      box-shadow: 0 6px 15px rgba(140, 28, 64, 0.1);
      border: 2px solid #f28ab2;
    }

    .heart-divider {
      font-size: 45px;
      color: #ff3366;
      user-select: none;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    .avatar__44b0c {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <h1>Cuantos Puntos de amor tienen</h1>

  <div class="counter-container">
    <div id="counter" class="counter-number">Cargando...</div>
    <button id="increment-btn" disabled>❤️ ¡Dar Amor!</button>
  </div>

  <!-- Contenedor con ambas fotos y el corazón en medio -->
  <div class="profiles-wrapper">
    <!-- Perfil 1 (angelperez0991_68114) -->
    <div class="avatar__75742 clickable__75742">
      <div class="focusTarget__54e4b" aria-label="Ver foto de perfil" role="button" tabindex="0"></div>
      <div class="wrapper__44b0c" role="img" aria-label="angelperez0991_68114, En línea" aria-hidden="false" style="width: 120px; height: 120px;">
        <svg width="120" height="120" viewBox="0 0 120 120" class="mask__44b0c svg__44b0c" aria-hidden="true">
          <foreignObject x="0" y="0" width="120" height="120">
            <div class="avatarStack__44b0c overlay__75742">
              <img alt="Perfil 1" class="avatar__44b0c" aria-hidden="true" src="https://cdn.discordapp.com/avatars/1524232410865074367/f5d05c553a84cab85900e0f3613706cd.webp?size=128">
            </div>
          </foreignObject>
        </svg>
      </div>
    </div>

    <!-- Corazón en medio -->
    <div class="heart-divider">❤️</div>

    <!-- Perfil 2 (capybara06599) -->
    <div class="wrapper__44b0c" role="img" aria-label="capybara06599, Desconectado" aria-hidden="false" style="width: 120px; height: 120px;">
      <svg width="120" height="120" viewBox="0 0 120 120" class="mask__44b0c svg__44b0c" aria-hidden="true">
        <foreignObject x="0" y="0" width="120" height="120">
          <div class="avatarStack__44b0c overlay__75742">
            <img alt="Perfil 2" class="avatar__44b0c" aria-hidden="true" src="https://cdn.discordapp.com/avatars/1301904733258387597/ce7253ce96d965ed5f0fcb55f4f36937.webp?size=128">
          </div>
        </foreignObject>
      </svg>
    </div>
  </div>

  <!-- Audio elemento para reproduccion -->
  <audio id="audio-ander" src="ANDER.mp3" preload="auto"></audio>

  <!-- Firebase App y Realtime Database -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://clav-2da48-default-rtdb.firebaseio.com/",
      projectId: "clav-2da48"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const counterRef = ref(database, 'likesCount');

    const counterElement = document.getElementById('counter');
    const buttonElement = document.getElementById('increment-btn');
    const anderAudio = document.getElementById('audio-ander');

    // Escuchar cambios en tiempo real
    onValue(counterRef, (snapshot) => {
      const data = snapshot.val();
      if (data === null) {
        runTransaction(counterRef, () => 41);
      } else {
        counterElement.textContent = data;
        buttonElement.disabled = false;
      }
    });

    // Evento al presionar el botón
    buttonElement.addEventListener('click', () => {
      anderAudio.currentTime = 0;
      anderAudio.play().catch(error => console.log("Error al reproducir audio:", error));

      runTransaction(counterRef, (currentValue) => {
        return (currentValue || 41) + 1;
      });
    });
  </script>

</body>
</html>
